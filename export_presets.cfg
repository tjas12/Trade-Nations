[preset.0]

name="Web - iPhone landscape"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="original/*,research/*,docs/*,tests/*,tools/*,.validation/*"
encrypt_pck=false
encrypt_directory=false
script_export_mode=2
export_path="export/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><style>:root{--safe-left:env(safe-area-inset-left,0px);--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}html,body,canvas{touch-action:none;overscroll-behavior:none}body{margin:0}#canvas{outline:none}@media(orientation:portrait){body:after{content:'Rotate your phone to landscape to play';position:fixed;inset:0;display:grid;place-items:center;background:#243d24;color:white;font:24px sans-serif;z-index:9999;text-align:center;padding:32px}}</style>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.14, 0.24, 0.14, 1)

